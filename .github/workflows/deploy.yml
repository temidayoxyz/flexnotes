name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what the Pages deployment flow needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, matching the lockfile format produced locally
          # (npm 10 rejects optional deps entries npm 11 wrote).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          # Project pages are served from /<repo-name>/; feed Next's basePath.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          test -f out/404.html || { echo "out/404.html missing"; exit 1; }
          grep -q "/${{ github.event.repository.name }}/_next" out/index.html ||
            { echo "asset URLs are not prefixed with the base path"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
